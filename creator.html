document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

i, shadows, borders, motion\n   Sport-brand confidence: mostly square / lightly rounded corners,\n   strong flat color blocks, restrained shadows. Pills for tags & CTAs. */\n\n:root {\n  /* Corner radii — PANA leans tight & architectural, not bubbly */\n  --radius-none: 0;\n  --radius-xs: 4px;\n  --radius-sm: 8px;\n  --radius-md: 12px;\n  --radius-lg: 18px;\n  --radius-pill: 999px;\n\n  /* Border widths */\n  --border-w: 1.5px;      /* @kind other */\n  --border-w-bold: 2px;   /* @kind other */\n\n  /* Shadows — soft, neutral, low-spread. Red blocks rely on color, not shadow. */\n  --shadow-xs: 0 1px 2px rgba(17,17,17,0.06);\n  --shadow-sm: 0 2px 8px rgba(17,17,17,0.07);\n  --shadow-md: 0 8px 24px rgba(17,17,17,0.10);\n  --shadow-lg: 0 18px 48px rgba(17,17,17,0.14);\n  --shadow-red: 0 12px 32px rgba(255,73,55,0.30);  /* lift for red CTAs */\n\n  /* Motion */\n  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);   /* @kind other */\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1); /* @kind other */\n  --dur-fast: 120ms;  /* @kind other */\n  --dur: 200ms;       /* @kind other */\n  --dur-slow: 360ms;  /* @kind other */\n}\n\n/* PANA — base element styles & helpful utility classes.\n   Lightweight resets + brand defaults so bare HTML already looks \"PANA\". */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-body);\n  font-weight: var(--fw-regular);\n  font-size: var(--text-base);\n  line-height: var(--leading-normal);\n  color: var(--text-body);\n  background: var(--surface-page);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* Display headings use Bebas Neue */\nh1, h2, h3 {\n  font-family: var(--font-display);\n  font-weight: 400;\n  color: var(--text-strong);\n  line-height: var(--display-leading);\n  letter-spacing: var(--display-tracking);\n  text-transform: uppercase;\n  margin: 0 0 0.4em;\n}\nh1 { font-size: var(--display-xl); }\nh2 { font-size: var(--display-lg); }\nh3 { y:flex;align-items:center;gap:30px\">\n      <div style=\"display:flex;gap:28px;font-family:'Creato Display';font-weight:500;font-size:14px\">\n        <a href=\"index.html#services\" style=\"color:#b9b9c0;text-decoration:none\" style-hover=\"color:#fff\">{{ t.nav.services }}<\u002Fa>\n        <a href=\"#top\" style=\"color:#fff;text-decoration:none;font-weight:700\">{{ t.nav.creator }}<\u002Fa>\n        <a href=\"ueber-uns.html\" style=\"color:#b9b9c0;text-decoration:none\" style-hover=\"color:#fff\">{{ t.nav.about }}<\u002Fa>\n        <a href=\"karriere.html\" style=\"color:#b9b9c0;text-decoration:none\" style-hover=\"color:#fff\">{{ t.nav.career }}<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex;border:1px solid rgba(255,255,255,.2);border-radius:999px;overflow:hidden\">\n        <button sc-camel-on-click=\"{{ setDe }}\" style=\"padding:6px 13px;border:none;cursor:pointer;font-family:'Creato Display';font-weight:800;font-size:12px;background:{{ deBg }};color:{{ deColor }}\">DE<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ setEn }}\" style=\"padding:6px 13px;border:none;cursor:pointer;font-family:'Creato Display';font-weight:800;font-size:12px;background:{{ enBg }};color:{{ enColor }}\">EN<\u002Fbutton>\n      <\u002Fdiv>\n      <a href=\"index.html#contact\" style=\"padding:10px 22px;border-radius:999px;background:#ff4937;color:#fff;font-family:'Creato Display';font-weight:700;font-size:13px;text-decoration:none;transition:background .2s\" style-hover=\"background:#e23420\">{{ t.nav.cta }}<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <!-- ============ HERO ============ -->\n  <header id=\"top\" style=\"padding:96px 56px 64px;max-width:1200px;margin:0 auto\">\n    <h1 style=\"font-family:'Creato Display';font-weight:900;font-size:64px;line-height:1;letter-spacing:-.025em;color:#fff;margin:0\">{{ t.h1a }}<span style=\"font-style:italic;font-weight:400;color:#ff4937\">{{ t.h1b }}<\u002Fspan><\u002Fh1>\n  <\u002Fheader>\n\n  <!-- ============ ROSTER GRID ============ -->\n  <section style=\"padding:0 56px 120px;max-width:1200px;margin:0 auto\">\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:28px\">\n      <sc-for list=\"{{ roster }}\" as=\"c\" hint-placeholder-count=\"6\">\n        <div>\n          <div style=\"position:relative;height:480px;border-radius:18px;overflow:hidden;background:#111113;border:1px solid rgba(255,255,255,.08);cursor:pointer;transition:border-color .25s,transform .25s cubic-bezier(.22,1,.36,1)\" style-hover=\"border-color:#ff4937;transform:translateY(-4px)\">\n            <img src=\"{{ c.src }}\" alt=\"{{ c.name }}\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s cubic-bezier(.22,1,.36,1)\" style-hover=\"transform:scale(1.06)\">\n            <div style=\"position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.92) 100%);opacity:.7;transition:opacity .25s\" style-hover=\"opacity:1\"><\u002Fdiv>\n\n            <div style=\"position:absolute;left:0;right:0;bottom:0;padding:20px 22px;transition:opacity .2s\" style-hover=\"opacity:0\">\n              <div style=\"font-family:'Creato Display';font-weight:800;font-size:19px;color:#fff\">{{ c.name }}<\u002Fdiv>\n              <div style=\"font-family:'Creato Display';font-weight:500;font-size:14px;color:#ff4937\">{{ c.handle }}<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"position:absolute;left:0;right:0;bottom:0;padding:22px;opacity:0;transform:translateY(10px);transition:opacity .25s,transform .25s\" style-hover=\"opacity:1;transform:translateY(0)\">\n              <div style=\"font-family:'Creato Display';font-weight:800;font-size:19px;color:#fff\">{{ c.name }}<\u002Fdiv>\n              <div style=\"font-family:'Creato Display';font-weight:500;font-size:14px;color:#ff4937;margin-top:2px\">{{ c.handle }}<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:7px;margin-top:14px\">\n                <sc-for list=\"{{ c.channels }}\" as=\"ch\" hint-placeholder-count=\"2\">\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;font-family:'Creato Display';font-weight:600;font-size:13.5px;color:#d4d4da\">\n                    <span>{{ ch.platform }}<\u002Fspan>\n                    <span style=\"color:#fff;font-weight:800\">{{ ch.followers }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding:0 2px\">\n            <div>\n              <div style=\"font-family:'Creato Display';font-weight:800;font-size:17px;color:#fff\">{{ c.name }}<\u002Fdiv>\n              <div style=\"font-family:'Creato Display';font-weight:500;font-size:13px;color:#ff4937;margin-top:2px\">{{ c.handle }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:12px;padding:0 2px\">\n            <sc-for list=\"{{ c.channels }}\" as=\"ch\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;font-family:'Creato Display';font-weight:600;font-size:13.5px;color:#9a9aa2\">\n                <span style=\"display:flex;align-items:center;gap:8px\">\n                  <sc-if value=\"{{ ch.isInstagram }}\" hint-placeholder-val=\"{{ true }}\"><svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#9a9aa2\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" width=\"17\" height=\"17\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"5\"><\u002Frect><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><circle cx=\"17.4\" cy=\"6.6\" r=\"1.1\" fill=\"#9a9aa2\" stroke=\"none\"><\u002Fcircle><\u002Fsvg><\u002Fsc-if>\n                  <sc-if value=\"{{ ch.isTiktok }}\" hint-placeholder-val=\"{{ false }}\"><svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#9a9aa2\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" width=\"17\" height=\"17\"><path d=\"M16 3v11.5a3.5 3.5 0 1 1-3.5-3.5\"><\u002Fpath><path d=\"M16 3c.3 2.5 2 4.3 4.5 4.6\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                  <sc-if value=\"{{ ch.isYoutube }}\" hint-placeholder-val=\"{{ false }}\"><svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#9a9aa2\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" width=\"17\" height=\"17\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"4\"><\u002Frect><path d=\"M10 9.5v5l4.5-2.5z\" fill=\"#9a9aa2\" stroke=\"none\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                <\u002Fspan>\n                <span style=\"color:#fff;font-weight:800\">{{ ch.followers }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ NETZWERK ============ -->\n  <section style=\"padding:0 56px 120px;max-width:800px;margin:0 auto;text-align:center\">\n    <h2 style=\"font-family:'Creato Display';font-weight:900;font-size:38px;line-height:1.1;letter-spacing:-.02em;color:#fff;margin:0 0 18px\">{{ t.networkH1a }}<span style=\"font-style:italic;font-weight:400;color:#ff4937\">{{ t.networkH1b }}<\u002Fspan><\u002Fh2>\n    <p style=\"font-family:'Creato Display';font-weight:400;font-size:17px;line-height:1.6;color:#9a9aa2;margin:0\">{{ t.networkBody }}<\u002Fp>\n  <\u002Fsection>\n\n  <!-- ============ FOOTER ============ -->\n  <footer style=\"background:#000;border-top:1px solid rgba(255,255,255,.08);padding:44px 56px;text-align:center\">\n    <span style=\"font-family:'Creato Display';font-weight:400;font-size:13px;color:#6c6c74\">{{ t.copyright }}<\u002Fspan>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;defaultLang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;de&quot;,&quot;en&quot;],&quot;default&quot;:&quot;de&quot;,&quot;tsType&quot;:&quot;'de'|'en'&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { lang: (props.defaultLang === \"en\" ? \"en\" : \"de\") };\n  }\n  renderVals() {\n    const lang = this.state.lang;\n    const dict = {\n      de: {\n        nav: { services: \"Leistungen\", creator: \"Creator\", about: \"Über uns\", career: \"Karriere\", cta: \"Jetzt anfragen\" },\n        eyebrow: \"Unser Roster\",\n        h1a: \"Die Creator in unserem \", h1b: \"Portfolio\",\n        sub: \"Sport-Creator, die wir betreuen und mit Brands zusammenbringen. Fahr mit der Maus über eine Karte für Handle, Kanäle und Followerzahlen.\",\n        networkH1a: \"Und das ist nur \", networkH1b: \"unser Portfolio\",\n        networkBody: \"Wir haben nicht nur Creator in unserem eigenen Portfolio, sondern greifen auf ein breites Netzwerk von über 40+ Creatorn zurück — sodass wir für jedes Unternehmen und jede Kampagne immer die passenden Creator haben.\",\n        copyright: \"© 2026 PANA Agency GbR\"\n      },\n      en: {\n        nav: { services: \"Services\", creator: \"Creators\", about: \"About\", career: \"Careers\", cta: \"Let's talk\" },\n        eyebrow: \"Our roster\",\n        h1a: \"The creators in our \", h1b: \"portfolio\",\n        sub: \"Sport creators we manage and connect with brands. Hover a card for handle, channels and follower counts.\",\n        networkH1a: \"And that's just \", networkH1b: \"our portfolio\",\n        networkBody: \"We don't just work with creators in our own portfolio — we tap into a broad network of 40+ creators, so we always have the right creator for every brand and every campaign.\",\n        copyright: \"© 2026 PANA Agency GbR\"\n      }\n    };\n    const withIcons = (chs) => chs.map(ch => ({ ...ch, isInstagram: ch.platform === \"Instagram\", isTiktok: ch.platform === \"TikTok\", isYoutube: ch.platform === \"YouTube\" }));\n    const roster = [\n      { name: \"David Rau\", handle: \"@davidrau\", src: \"assets/creator-david-rau.jpg\", channels: [{ platform: \"Instagram\", followers: \"172.000\" }, { platform: \"TikTok\", followers: \"116.263\" }, { platform: \"YouTube\", followers: \"178.000\" }] },\n      { name: \"Florijon Belegu\", handle: \"@belegu15\", src: \"assets/creator-florijon-belegu.jpg\", channels: [{ platform: \"Instagram\", followers: \"13.500\" }, { platform: \"TikTok\", followers: \"83.700\" }, { platform: \"YouTube\", followers: \"6.630\" }] },\n      { name: \"Dylan Bos\", handle: \"@_dylanbos_\", src: \"assets/creator-dylan-bos.jpg\", channels: [{ platform: \"Instagram\", followers: \"2.527\" }, { platform: \"TikTok\", followers: \"7.215\" }] },\n      { name: \"Benjamin Zeisel\", handle: \"@benjiblanco.football\", src: \"assets/creator-benjamin-zeisel.jpg\", channels: [{ platform: \"Instagram\", followers: \"2.520\" }, { platform: \"TikTok\", followers: \"321.474\" }] },\n      { name: \"Danny King\", handle: \"@dannykingk5\", src: \"assets/creator-danny-king.jpg\", channels: [{ platform: \"Instagram\", followers: \"40.700\" }, { platform: \"TikTok\", followers: \"214.820\" }] },\n      { name: \"Amar Cekic\", handle: \"@cekinho10\", src: \"assets/creator-amar-cekic.jpg\", channels: [{ platform: \"Instagram\", followers: \"10.600\" }] }\n    ];\n    return {\n      t: dict[lang], roster: roster.map(r => ({ ...r, channels: withIcons(r.channels) })),\n      setDe: () => this.setState({ lang: \"de\" }),\n      setEn: () => this.setState({ lang: \"en\" }),\n      deBg: lang === \"de\" ? \"#ff4937\" : \"transparent\",\n      deColor: lang === \"de\" ? \"#fff\" : \"#9a9aa2\",\n      enBg: lang === \"en\" ? \"#ff4937\" : \"transparent\",\n      enColor: lang === \"en\" ? \"#fff\" : \"#9a9aa2\"\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
